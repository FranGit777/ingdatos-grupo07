# CI del pipeline_grupo07. Corre en cada push y en cada pull request.
# Tres jobs en paralelo; si cualquiera falla, el check queda en rojo y, con la
# protección de rama de main activada, el cambio no se puede mergear.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credenciales:
    name: Sin credenciales en el repo
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Buscar .env versionados y claves escritas en el código
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::Hay un .env versionado"; exit 1
          fi
          # Auth-Key de URLhaus (48 hex) u otras claves largas en hexadecimal
          if git grep -nIE '[0-9a-f]{40,}' -- . ':!*.lock'; then
            echo "::error::Parece haber una clave escrita en el código"; exit 1
          fi
          echo "OK: no hay credenciales versionadas"

  dag:
    name: DAG importa en Airflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIRFLOW_HOME: /tmp/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar Airflow 2.10.5 (constraints oficiales)
        run: |
          pip install "apache-airflow==2.10.5" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt"
      - name: Sintaxis de Python de dags/
        run: python -m py_compile dags/*.py
      - name: Importar el DAG y verificar tareas, dependencias, schedule y reintentos
        run: |
          airflow db migrate > /dev/null
          python ci/verificar_dag.py

  dbt:
    name: dbt parse + build con bronze de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MINIO_BUCKET: grupo07
      AWS_ACCESS_KEY_ID: minioadmin          # credenciales del S3 descartable del CI, no las del servidor
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://localhost:9000
      AWS_REGION: us-east-1
      S3_ENDPOINT: localhost:9000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Instalar dbt-duckdb, deltalake y un S3 de prueba
        run: pip install -r ci/requirements.txt "moto[server]>=5"
      - name: Levantar un S3 descartable (moto, compatible con MinIO)
        run: |
          moto_server -p 9000 > /tmp/s3.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/ > /dev/null && break; sleep 1; done
      - name: Ingesta con columnas en otro orden, una nueva o una faltante
        run: python ci/probar_columnas.py
      - name: Cargar bronze de prueba en el S3 (misma ruta y esquema que el DAG)
        run: python ci/bronze_de_prueba.py
      - name: dbt parse (el SQL y el schema.yml compilan)
        working-directory: dbt
        run: dbt parse --profiles-dir .
      - name: dbt build (modelos + tests)
        working-directory: dbt
        run: dbt build --profiles-dir .
