ingdatos:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: warehouse.duckdb
      extensions:
        - httpfs
      settings:
        # Credenciales y endpoint de MinIO desde el entorno (JupyterHub o dags/.env en Airflow)
        s3_endpoint: "{{ env_var('S3_ENDPOINT', 'minio:9000') }}"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
        s3_region: "{{ env_var('AWS_REGION', 'us-east-1') }}"
        s3_use_ssl: "false"
        s3_url_style: "path"
